<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Home</title>

  <style>

    body{
      margin:0;
      background:black;
      color:white;
      font-family:Arial;
    }

    .navbar{
      background:#111;
      padding:20px;
      font-size:30px;
      color:red;
      font-weight:bold;
    }

    .banner{
      height:90vh;
      background:url('img/banner.jpg') center/cover;
      display:flex;
      align-items:center;
      padding-left:50px;
    }

    .content h1{
      font-size:60px;
    }

    .content p{
      width:500px;
      line-height:1.5;
    }

    button{
      padding:12px 25px;
      margin-right:10px;
      border:none;
      cursor:pointer;
      font-size:16px;
    }

    .movies{
      padding:20px;
    }

    .row{
      display:flex;
      gap:10px;
      overflow-x:auto;
    }

    .row img{
      width:250px;
      border-radius:5px;
      transition:0.3s;
    }

    .row img:hover{
      transform:scale(1.1);
    }

  </style>
</head>
<body>

  <div class="navbar">
    NETFLIX
  </div>

  <div class="banner">

    <div class="content">
      <h1>LIFE OF US</h1>

      <p>
        When we meet ? FT.Garvv & Yashi
      </p>

      <button onclick="window.location.href='video.html'">
      ▶ Play
      </button>
      <button>More Info</button>
    </div>

  </div>

  <div class="movies">

    <h2>Popular</h2>

    <div class="row">
      <img src="img/movie1.jpg">
      <img src="img/movie2.jpg">
      <img src="img/movie3.jpg">
      <img src="img/movie4.jpg">
    </div>

  </div>

</body>
</html>
