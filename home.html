<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Home</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:black;
      color:white;
    }

    /* NAVBAR */

    .navbar{
      background:#111;
      padding:20px 40px;
      font-size:32px;
      color:red;
      font-weight:bold;
      position:fixed;
      width:100%;
      top:0;
      z-index:100;
    }

    /* BANNER */

    .banner{
      height:85vh;
      display:flex;
      align-items:center;
      padding-left:60px;
      position:relative;
      overflow:hidden;
    }

    .banner img{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-1;
    }

    /* DARK OVERLAY */

    .banner::after{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      top:0;
      left:0;
      background:rgba(0,0,0,0.45);
      z-index:-1;
    }

    /* CONTENT */

    .content{
      max-width:550px;
    }

    .content h1{
      font-size:70px;
      margin-bottom:20px;
    }

    .content p{
      font-size:20px;
      line-height:1.6;
      margin-bottom:25px;
    }

    /* BUTTONS */

    .buttons button{
      padding:12px 28px;
      border:none;
      cursor:pointer;
      font-size:18px;
      border-radius:5px;
      margin-right:10px;
      transition:0.3s;
    }

    .play{
      background:white;
      color:black;
    }

    .play:hover{
      background:#ddd;
    }

    .info{
      background:rgba(109,109,110,0.7);
      color:white;
    }

    .info:hover{
      background:rgba(109,109,110,0.4);
    }

    /* MOVIE SECTION */

    .movies{
      padding:20px;
      margin-top:-40px;
      position:relative;
      z-index:10;
    }

    .movies h2{
      margin-bottom:18px;
      font-size:30px;
    }

    /* MOVIE ROW */

    .row{
      display:flex;
      gap:15px;
      overflow-x:auto;
      padding:10px 0;
      scrollbar-width:none;
    }

    .row::-webkit-scrollbar{
      display:none;
    }

    /* MOVIE POSTERS */

    .row img{
      width:200px;
      height:300px;
      object-fit:cover;
      border-radius:8px;
      transition:0.3s;
      cursor:pointer;
      flex-shrink:0;
    }

    .row img:hover{
      transform:scale(1.08);
    }

  </style>
</head>
<body>

  <!-- NAVBAR -->

  <div class="navbar">
    LOVE STORY
  </div>

  <!-- BANNER -->

  <div class="banner">

    <img src="banner.jpeg" alt="Banner">

    <div class="content">

      <h1>Fall in Love</h1>

      <p>
        When we meet ? FT. Garvv & Yashi ❤️
      </p>

      <div class="buttons">

        <!-- PLAY BUTTON -->

        <button class="play"
        onclick="window.location.href='video.html'">

          ▶ Play

        </button>

        <!-- INFO BUTTON -->

        <button class="info">

          More Info

        </button>

      </div>

    </div>

  </div>

  <!-- MOVIES SECTION -->

  <div class="movies">

    <h2>Popular</h2>

    <div class="row">

      <img src="movie1.jpeg" alt="">
      <img src="movie2.jpeg" alt="">
      <img src="movie3.jpeg" alt="">
      <img src="movie4.jpeg" alt="">
      <img src="movie5.jpeg" alt="">

    </div>

  </div>

</body>
</html>
