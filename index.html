<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's Watching?</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#141414;
      color:white;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    h1{
      font-size:65px;
      margin-bottom:60px;
      font-weight:500;
    }

    .profiles{
      display:flex;
      gap:50px;
    }

    .profile{
      text-align:center;
      cursor:pointer;
      transition:0.3s;
    }

    .profile img{
      width:180px;
      height:180px;
      border-radius:10px;
      border:4px solid transparent;
      object-fit:cover;
      transition:0.3s;
    }

    .profile p{
      margin-top:15px;
      font-size:22px;
      color:gray;
      transition:0.3s;
    }

    .profile:hover img{
      border-color:white;
      transform:scale(1.05);
    }

    .profile:hover p{
      color:white;
    }

    a{
      text-decoration:none;
    }

  </style>
</head>
<body>

  <h1>Who's Watching?</h1>

  <div class="profiles">

    <!-- PROFILE 1 -->

    <a href="home.html">

      <div class="profile">

        <img src="user1.jpeg" alt="Yashi">

        <p>US>>></p>

      </div>

    </a>

    <!-- PROFILE 2 -->

    <a href="home.html">

      <div class="profile">

        <img src="user2.jpeg" alt="Garvv">

        <p>Yavi>>></p>

      </div>

    </a>

  </div>

</body>
</html>
