<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's Watching</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#141414;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    h1{
      font-size:60px;
      margin-bottom:50px;
    }

    .profiles{
      display:flex;
      gap:30px;
    }

    .profile{
      text-align:center;
    }

    .profile img{
      width:160px;
      height:160px;
      border-radius:10px;
      transition:0.3s;
      border:4px solid transparent;
    }

    .profile img:hover{
      border-color:white;
      transform:scale(1.05);
    }

    .profile p{
      margin-top:10px;
      color:gray;
      font-size:20px;
    }

    a{
      text-decoration:none;
      color:white;
    }

  </style>
</head>
<body>

  <h1>Who's Watching?</h1>

  <div class="profiles">

    <!-- LINK TO HOME PAGE -->

    <a href="home.html">
      <div class="profile">
        <img src="user1.jpg">
        <p>Yashi</p>
      </div>
    </a>

    <a href="home.html">
      <div class="profile">
        <img src="user2.jpg">
        <p>SGarvv</p>
      </div>
    </a>

    <a href="home.html">
      <div class="profile">
        <img src="user3.jpg">
        <p>US>>>3</p>
      </div>
    </a>

  </div>

</body>
</html>
